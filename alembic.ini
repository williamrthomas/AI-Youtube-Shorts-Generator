# Alembic configuration (§22: every database change goes through a migration).
[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
# The URL is resolved from MPVF settings in migrations/env.py; this is a
# placeholder so alembic's own tooling has something to parse.
sqlalchemy.url = sqlite:///data/mpvf.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
