[project]
name = "mpvf"
version = "0.1.0"
description = "Maine Property Video Factory - evidence-first real-estate video production pipeline"
readme = "README-MPVF.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
acquisition = ["playwright>=1.44", "selectolax>=0.3"]
local-ai = ["ollama>=0.3"]
speech = ["kokoro>=0.9", "faster-whisper>=1.0"]
publish = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "alembic>=1.13"]

[project.scripts]
mpvf = "mpvf.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpvf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["mpvf"]
mypy_path = "src"
ignore_missing_imports = true
