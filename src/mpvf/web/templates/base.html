<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Maine Property Video Factory{% endblock %}</title>
  <style>
    :root {
      --ink: #0F2A43; --paper: #F6F1E4; --accent: #7FA99B;
      --secondary: #A6402F; --muted: #6E7B85; --line: #dcd6c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header { background: var(--ink); color: var(--paper); padding: 12px 24px; }
    header a { color: var(--paper); text-decoration: none; margin-right: 18px; font-weight: 500; }
    header a:hover { color: var(--accent); }
    header .brand { font-weight: 700; letter-spacing: .4px; margin-right: 28px; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 28px 0 10px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #efe9db; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 12px; font-weight: 600; }
    .ok { background: #dcece3; color: #1d5c43; }
    .warn { background: #f7ecd2; color: #7a5a12; }
    .fail { background: #f5dcd8; color: #7d271b; }
    .muted { color: var(--muted); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
    .stages span { padding: 4px 10px; border-radius: 4px; background: #e7e1d2; font-size: 12px; }
    .stages span.complete { background: #dcece3; }
    .stages span.running { background: #f7ecd2; }
    .stages span.failed { background: #f5dcd8; }
    pre { background: #fff; border: 1px solid var(--line); padding: 12px; overflow-x: auto; font-size: 13px; }
    .segment { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; margin-bottom: 18px; }
    .segment.failed { border-left-color: var(--secondary); }
    .thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
    .thumbs img { max-width: 280px; border: 1px solid var(--line); }
    a { color: #14567f; }
    .banner { padding: 12px 16px; border-radius: 6px; margin-bottom: 18px; font-weight: 500; }
  </style>
</head>
<body>
<header>
  <a class="brand" href="/">MPVF</a>
  <a href="/">Today</a>
  <a href="/settings">Settings</a>
  <a href="/api/docs">API</a>
</header>
<main>
  {% block body %}{% endblock %}
</main>
</body>
</html>
